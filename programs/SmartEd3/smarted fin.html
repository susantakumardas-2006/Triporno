<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SmartEd — Learn with proof</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050507;
    --bg-2:#0a0a10;
    --glass: rgba(255,255,255,0.045);
    --glass-strong: rgba(255,255,255,0.075);
    --glass-border: rgba(255,255,255,0.09);
    --glass-border-soft: rgba(255,255,255,0.06);
    --text:#f3f3f6;
    --text-dim:#9b9ba7;
    --text-faint:#63636e;
    --emerald:#37e2a0;
    --emerald-soft: rgba(55,226,160,0.14);
    --emerald-line: rgba(55,226,160,0.35);
    --red:#f2515c;
    --red-soft: rgba(242,81,92,0.14);
    --radius-lg: 22px;
    --radius-md: 14px;
    --radius-sm: 9px;
    --font-display:'Space Grotesk', sans-serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    overflow-x:hidden;
  }
  ::selection{ background: var(--emerald-soft); color:#fff; }
  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background: rgba(255,255,255,0.12); border-radius:10px; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; cursor:pointer; }
  input,select{ font-family:inherit; }
  :focus-visible{ outline: 2px solid var(--emerald); outline-offset: 2px; border-radius: 4px; }

  /* ---------- ambient background ---------- */
  .noise-veil{
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image: radial-gradient(rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 3px 3px;
    opacity:.5;
  }
  .aurora{
    position:fixed; inset:-20%; z-index:0; pointer-events:none;
    background:
      radial-gradient(38% 32% at 18% 20%, rgba(55,226,160,0.10), transparent 60%),
      radial-gradient(30% 30% at 82% 12%, rgba(255,255,255,0.06), transparent 60%),
      radial-gradient(45% 40% at 70% 85%, rgba(55,226,160,0.06), transparent 60%);
    animation: driftAurora 26s ease-in-out infinite alternate;
    filter: blur(10px);
  }
  @keyframes driftAurora{
    0%{ transform: translate(0,0) scale(1); }
    100%{ transform: translate(-2%, 2%) scale(1.06); }
  }
  @media (prefers-reduced-motion: reduce){
    .aurora{ animation:none; }
    *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
  }

  #app{ position:relative; z-index:1; min-height:100vh; }

  /* ---------- glass primitives ---------- */
  .glass{
    background: linear-gradient(180deg, var(--glass), rgba(255,255,255,0.02));
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-radius: var(--radius-lg);
  }
  .glass-tight{ border-radius: var(--radius-md); }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:12px 22px; border-radius: 999px; border:1px solid transparent;
    font-family: var(--font-body); font-weight:600; font-size:14px;
    transition: transform .15s ease, background .2s ease, border-color .2s ease, opacity .2s ease;
    white-space:nowrap;
  }
  .btn:active{ transform: scale(.97); }
  .btn-primary{ background:#f3f3f6; color:#08080a; }
  .btn-primary:hover{ background:#fff; }
  .btn-ghost{ background: transparent; border-color: var(--glass-border); color: var(--text); }
  .btn-ghost:hover{ background: var(--glass); }
  .btn-emerald{ background: var(--emerald-soft); color: var(--emerald); border-color: var(--emerald-line); }
  .btn-emerald:hover{ background: rgba(55,226,160,0.22); }
  .btn-sm{ padding:8px 16px; font-size:12.5px; }
  .btn-block{ width:100%; }

  .tag{
    display:inline-flex; align-items:center; gap:6px; font-family: var(--font-mono);
    font-size:11px; letter-spacing:.02em; padding:4px 9px; border-radius:7px;
    border:1px solid var(--glass-border); color: var(--text-dim);
  }
  .tag-easy{ color:var(--emerald); border-color: var(--emerald-line); background: var(--emerald-soft); }
  .tag-medium{ color:#f2c94c; border-color: rgba(242,201,76,0.35); background: rgba(242,201,76,0.1); }
  .tag-hard{ color:var(--red); border-color: rgba(242,81,92,0.35); background: var(--red-soft); }

  .eyebrow{ font-family: var(--font-mono); font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color: var(--text-faint); }

  /* ---------- LOGIN VIEW ---------- */
  .login-shell{
    min-height:100vh; display:grid; grid-template-columns: 1.15fr 1fr;
  }
  @media (max-width: 980px){ .login-shell{ grid-template-columns: 1fr; } .login-left{ display:none; } }

  .login-left{
    position:relative; display:flex; flex-direction:column; justify-content:space-between;
    padding: 56px 64px; overflow:hidden; border-right:1px solid var(--glass-border-soft);
  }
  .brand{ display:flex; align-items:center; gap:10px; font-family: var(--font-display); font-weight:700; font-size:19px; letter-spacing:.01em; }
  .brand-mark{ width:30px; height:30px; border-radius:9px; background:linear-gradient(135deg, var(--emerald), #0d8a5c); display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-weight:700; color:#04140c; font-size:14px; }

  .hero-copy{ max-width:560px; margin-top:40px; }
  .hero-copy .eyebrow{ margin-bottom:18px; }
  .hero-copy h1{
    font-family: var(--font-display); font-weight:600; font-size:clamp(34px, 4vw, 52px);
    line-height:1.06; letter-spacing:-0.01em; color:#fff;
  }
  .hero-copy h1 em{ font-style:normal; color: var(--emerald); }
  .hero-copy p{ margin-top:20px; color: var(--text-dim); font-size:15.5px; line-height:1.65; max-width:460px; }

  .pillars{ display:flex; gap:14px; margin-top:34px; flex-wrap:wrap; }
  .pillar{ padding:12px 16px; border-radius:12px; }
  .pillar .n{ font-family:var(--font-mono); font-size:20px; color:#fff; }
  .pillar .l{ font-size:11.5px; color:var(--text-faint); margin-top:3px; }

  .constellation-wrap{ position:absolute; right:-8%; bottom:-6%; width:520px; height:520px; opacity:.9; pointer-events:none; }

  .foot-note{ font-family: var(--font-mono); font-size:11.5px; color:var(--text-faint); position:relative; z-index:2; }

  .login-right{ display:flex; align-items:center; justify-content:center; padding:40px 28px; position:relative; }
  .login-card{ width:100%; max-width:420px; padding:38px 34px; position:relative; }
  .login-card h2{ font-family: var(--font-display); font-size:24px; font-weight:600; color:#fff; }
  .login-card .sub{ color:var(--text-dim); font-size:13.5px; margin-top:6px; margin-bottom:26px; }

  .role-toggle{ display:flex; padding:4px; border-radius:999px; background: rgba(255,255,255,0.03); border:1px solid var(--glass-border); margin-bottom:24px; }
  .role-opt{ flex:1; text-align:center; padding:9px 6px; border-radius:999px; font-size:12.5px; font-weight:600; color:var(--text-dim); transition: all .2s ease; }
  .role-opt.active{ background:#fff; color:#0a0a0a; }

  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:12px; color:var(--text-dim); margin-bottom:7px; font-weight:600; letter-spacing:.01em; }
  .field input{
    width:100%; padding:12px 14px; border-radius:12px; background: rgba(255,255,255,0.03);
    border:1px solid var(--glass-border); color:#fff; font-size:14px; transition: border-color .2s ease, background .2s ease;
  }
  .field input::placeholder{ color: var(--text-faint); }
  .field input:focus{ border-color: var(--emerald-line); background: rgba(255,255,255,0.05); outline:none; }

  .login-err{ display:none; align-items:center; gap:8px; font-size:12.5px; color:var(--red); background:var(--red-soft); border:1px solid rgba(242,81,92,0.3); padding:10px 12px; border-radius:10px; margin-bottom:16px; }
  .login-err.show{ display:flex; }

  .demo-box{ margin-top:22px; padding:14px 15px; border-radius:14px; background: rgba(255,255,255,0.025); border:1px dashed var(--glass-border); }
  .demo-box .dt{ font-size:11px; color: var(--text-faint); letter-spacing:.08em; text-transform:uppercase; margin-bottom:9px; font-weight:600; }
  .demo-row{ display:flex; align-items:center; justify-content:space-between; font-family: var(--font-mono); font-size:12px; color: var(--text-dim); padding:5px 0; }
  .demo-row button{ background:none; border:none; color: var(--emerald); font-family:var(--font-mono); font-size:11px; }
  .demo-row button:hover{ text-decoration:underline; }

  /* ---------- APP SHELL ---------- */
  .shell{ display:flex; min-height:100vh; }
  .sidebar{
    width:236px; flex-shrink:0; display:flex; flex-direction:column; padding:22px 16px;
    border-right:1px solid var(--glass-border-soft); position:sticky; top:0; height:100vh;
  }
  @media (max-width: 880px){ .sidebar{ display:none; } }
  .sb-brand{ display:flex; align-items:center; gap:10px; padding:6px 10px 26px 10px; font-family:var(--font-display); font-weight:700; font-size:16.5px; }
  .sb-section-label{ font-size:10.5px; letter-spacing:.12em; color:var(--text-faint); text-transform:uppercase; margin: 14px 10px 8px; font-weight:700; }
  .sb-item{
    display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:11px; color:var(--text-dim);
    font-size:13.5px; font-weight:500; margin-bottom:2px; transition: background .15s ease, color .15s ease; border:1px solid transparent;
  }
  .sb-item svg{ width:17px; height:17px; flex-shrink:0; opacity:.85; }
  .sb-item:hover{ background: var(--glass); color:#fff; }
  .sb-item.active{ background: var(--glass-strong); color:#fff; border-color: var(--glass-border); }
  .sb-item.active svg{ color: var(--emerald); opacity:1; }
  .sb-foot{ margin-top:auto; padding:12px; }
  .sb-user{ display:flex; align-items:center; gap:10px; padding:10px; border-radius:12px; background:var(--glass); border:1px solid var(--glass-border-soft); }
  .avatar{ width:34px; height:34px; border-radius:10px; background: linear-gradient(135deg, var(--emerald), #0b6f49); display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-weight:700; font-size:13px; color:#04140c; flex-shrink:0; }
  .sb-user .name{ font-size:12.5px; font-weight:600; color:#fff; }
  .sb-user .role{ font-size:10.5px; color: var(--text-faint); }
  .logout-btn{ width:100%; margin-top:10px; }

  .main{ flex:1; min-width:0; }
  .topbar{
    display:flex; align-items:center; justify-content:space-between; padding:18px 32px;
    border-bottom:1px solid var(--glass-border-soft); position:sticky; top:0; backdrop-filter: blur(14px); z-index:5; background: rgba(5,5,7,0.65);
  }
  .topbar-title{ font-family: var(--font-display); font-size:19px; font-weight:600; color:#fff; }
  .topbar-sub{ font-size:12px; color: var(--text-faint); margin-top:2px; }
  .topbar-right{ display:flex; align-items:center; gap:12px; }
  .search-box{ display:flex; align-items:center; gap:8px; padding:9px 14px; border-radius:999px; background: var(--glass); border:1px solid var(--glass-border-soft); min-width:220px; }
  .search-box input{ background:none; border:none; color:#fff; font-size:12.5px; width:100%; }
  .search-box input::placeholder{ color: var(--text-faint); }
  .search-box svg{ width:14px; height:14px; color: var(--text-faint); flex-shrink:0; }

  .content{ padding:28px 32px 60px; max-width:1360px; }

  /* ---------- grid / cards ---------- */
  .grid{ display:grid; gap:16px; }
  .g-4{ grid-template-columns: repeat(4, 1fr); }
  .g-3{ grid-template-columns: repeat(3, 1fr); }
  .g-2{ grid-template-columns: repeat(2, 1fr); }
  .g-12-8{ grid-template-columns: 1.4fr 1fr; }
  @media (max-width: 1080px){ .g-4{ grid-template-columns: repeat(2,1fr);} .g-3{ grid-template-columns: repeat(2,1fr);} .g-12-8{ grid-template-columns: 1fr; } }
  @media (max-width: 620px){ .g-4,.g-3,.g-2{ grid-template-columns: 1fr; } }

  .card{ padding:22px; }
  .card-head{ display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:16px; }
  .card-head h3{ font-family: var(--font-display); font-size:15px; font-weight:600; color:#fff; }
  .card-head .cap{ font-size:11.5px; color:var(--text-faint); margin-top:3px; }

  .stat-card{ padding:20px 22px; }
  .stat-card .label{ font-size:12px; color: var(--text-dim); font-weight:500; }
  .stat-card .value{ font-family: var(--font-display); font-size:30px; font-weight:600; color:#fff; margin-top:9px; }
  .stat-card .delta{ font-family: var(--font-mono); font-size:11.5px; margin-top:8px; display:inline-flex; align-items:center; gap:5px; }
  .delta-up{ color: var(--emerald); }
  .delta-down{ color: var(--red); }

  .topic-card{ padding:16px 18px; }
  .topic-card .tname{ font-size:13.5px; font-weight:600; color:#fff; }
  .topic-bar-track{ height:6px; border-radius:99px; background: rgba(255,255,255,0.06); margin-top:12px; overflow:hidden; }
  .topic-bar-fill{ height:100%; border-radius:99px; background: linear-gradient(90deg, #1f8f66, var(--emerald)); }
  .topic-card .pct{ font-family: var(--font-mono); font-size:11px; color: var(--text-faint); margin-top:8px; }

  .queue-row{ display:flex; align-items:center; gap:14px; padding:13px 14px; border-radius:13px; transition: background .15s ease; cursor:pointer; }
  .queue-row:hover{ background: var(--glass); }
  .queue-row + .queue-row{ margin-top:2px; }
  .qi{ width:30px; height:30px; border-radius:8px; background: var(--glass-strong); display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:11px; color: var(--text-dim); flex-shrink:0; }
  .queue-row .qtitle{ font-size:13.5px; font-weight:500; color:#fff; }
  .queue-row .qmeta{ font-size:11.5px; color: var(--text-faint); margin-top:2px; }
  .queue-row .qright{ margin-left:auto; display:flex; align-items:center; gap:10px; }

  /* ---------- contribution calendar ---------- */
  .cal-summary{ display:flex; gap:26px; flex-wrap:wrap; margin-bottom:20px; }
  .cal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .cal-title{ font-family: var(--font-display); font-size:16px; font-weight:600; color:#fff; }
  .cal-nav{ display:flex; align-items:center; gap:6px; }
  .cal-nav-btn{ width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center; color: var(--text-dim); border:1px solid var(--glass-border); background: transparent; }
  .cal-nav-btn:hover{ background: var(--glass); color:#fff; }
  .cal-nav-btn svg{ width:15px; height:15px; }
  .cal-nav-btn.today-btn{ width:auto; padding:0 12px; font-family:var(--font-mono); font-size:11px; }

  .cal-weekdays{ display:grid; grid-template-columns: repeat(7, 1fr); gap:6px; margin-bottom:6px; }
  .cal-weekdays span{ text-align:center; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color: var(--text-faint); font-weight:600; }
  .cal-grid{ display:grid; grid-template-columns: repeat(7, 1fr); gap:6px; }
  .cal-cell{
    position:relative; aspect-ratio:1; border-radius:10px; display:flex; flex-direction:column;
    align-items:flex-start; justify-content:flex-start; padding:6px 7px; border:1px solid transparent;
    background: rgba(255,255,255,0.035); transition: transform .12s ease, border-color .15s ease;
  }
  .cal-cell.has-data{ cursor:pointer; }
  .cal-cell.has-data:hover{ transform: translateY(-2px); border-color: var(--glass-border); }
  .cal-cell .dnum{ font-family: var(--font-mono); font-size:11px; color: var(--text-dim); }
  .cal-cell.empty{ background:transparent; }
  .cal-cell.future .dnum{ color: var(--text-faint); opacity:.4; }
  .cal-cell.today{ border-color: var(--emerald-line); }
  .cal-cell.today .dnum{ color:#fff; font-weight:700; }
  .cal-cell.selected{ border-color: var(--emerald); box-shadow: 0 0 0 1px var(--emerald) inset; }
  .cal-cell .dot{ margin-top:auto; width:8px; height:8px; border-radius:3px; align-self:flex-end; }

  .cal-legend{ display:flex; align-items:center; gap:6px; margin-top:16px; font-size:11px; color: var(--text-faint); }
  .cal-legend .lg-cell{ width:11px; height:11px; border-radius:3px; }

  .cal-detail{ margin-top:18px; padding:15px 16px; border-radius:14px; background: rgba(255,255,255,0.03); border:1px solid var(--glass-border-soft); }
  .cal-detail .dd-date{ font-family: var(--font-display); font-size:14.5px; color:#fff; font-weight:600; }
  .cal-detail .dd-meta{ font-size:12px; color: var(--text-dim); margin-top:6px; line-height:1.6; }
  .cal-detail .dd-topics{ display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }

  /* ---------- mastery strength lists ---------- */
  .mastery-list-group{ margin-bottom:18px; }
  .mastery-list-group:last-child{ margin-bottom:0; }
  .mlg-label{ display:flex; align-items:center; gap:7px; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color: var(--text-faint); font-weight:700; margin-bottom:10px; }
  .mlg-label .dot{ width:7px; height:7px; border-radius:50%; }
  .mastery-item{ display:flex; align-items:center; gap:12px; padding:9px 0; }
  .mastery-item .mi-name{ font-size:13px; color:#fff; font-weight:500; width:132px; flex-shrink:0; }
  .mastery-item .mi-track{ flex:1; height:6px; border-radius:99px; background: rgba(255,255,255,0.06); overflow:hidden; }
  .mastery-item .mi-fill{ height:100%; border-radius:99px; }
  .mastery-item .mi-val{ font-family: var(--font-mono); font-size:11.5px; color: var(--text-dim); width:34px; text-align:right; flex-shrink:0; }

  /* ---------- institute directory ---------- */
  .inst-grid{ display:grid; grid-template-columns: repeat(2, 1fr); gap:16px; }
  @media (max-width: 880px){ .inst-grid{ grid-template-columns: 1fr; } }
  .inst-card{ padding:22px; position:relative; }
  .inst-card.own{ border-color: var(--emerald-line); background: linear-gradient(180deg, rgba(55,226,160,0.07), rgba(255,255,255,0.02)); }
  .inst-card.other{ cursor:pointer; }
  .inst-card.other:hover{ border-color: var(--glass-border); }
  .inst-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .inst-name{ font-family: var(--font-display); font-size:16px; font-weight:600; color:#fff; display:flex; align-items:center; gap:8px; }
  .inst-loc{ font-size:12px; color: var(--text-faint); margin-top:4px; }
  .inst-rank-badge{ font-family: var(--font-mono); font-size:11px; padding:5px 10px; border-radius:8px; background: var(--glass-strong); border:1px solid var(--glass-border); color:#fff; flex-shrink:0; white-space:nowrap; }
  .inst-meta-row{ display:flex; gap:22px; margin-top:18px; }
  .inst-meta-row .m .v{ font-family: var(--font-mono); font-weight:600; font-size:16px; color:#fff; }
  .inst-meta-row .m .l{ font-size:11px; color: var(--text-faint); margin-top:2px; }
  .inst-hint{ margin-top:16px; font-size:11.5px; color: var(--text-faint); display:flex; align-items:center; gap:6px; }
  .inst-hint svg{ width:13px; height:13px; transition: transform .25s ease; }
  .inst-card.other.pinned .inst-hint svg, .inst-card.other:hover .inst-hint svg{ transform: rotate(180deg); }

  .inst-popover{ max-height:0; opacity:0; overflow:hidden; transition: max-height .35s ease, opacity .3s ease, margin-top .35s ease; margin-top:0; }
  .inst-card.other:hover .inst-popover, .inst-card.other.pinned .inst-popover{ max-height:600px; opacity:1; margin-top:18px; }
  .inst-popover-inner{ padding-top:16px; border-top:1px solid var(--glass-border-soft); }
  .inst-pop-label{ font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color: var(--text-faint); font-weight:700; margin:0 0 9px; }
  .inst-pop-label:not(:first-child){ margin-top:16px; }
  .inst-fac-row{ display:flex; justify-content:space-between; align-items:center; padding:6px 0; font-size:12.5px; }
  .inst-fac-row .fname{ color:#fff; font-weight:500; }
  .inst-fac-row .ffield{ color: var(--text-dim); font-family: var(--font-mono); font-size:11px; }
  .inst-star-row{ display:flex; justify-content:space-between; align-items:center; padding:6px 0; font-size:12.5px; }
  .inst-star-row .sname{ color:#fff; font-weight:500; display:flex; align-items:center; gap:7px; }
  .inst-star-row .sname svg{ width:13px; height:13px; color:#f2c94c; }
  .inst-star-row .sval{ font-family: var(--font-mono); color: var(--emerald); font-size:11.5px; }
  .admit-btn{ margin-top:16px; width:100%; }

  table{ width:100%; border-collapse:collapse; font-size:13px; }

/* =========================================================
   CONTRIBUTION CALENDAR ENGINE (deterministic mock activity)
========================================================= */
const MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const WEEKDAY_LABELS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

function hashStr(s){ let h = 0; for(let i=0;i<s.length;i++){ h = (h<<5) - h + s.charCodeAt(i); h |= 0; } return Math.abs(h); }
function seeded01(s){ const h = hashStr(s); return (h % 10000) / 10000; }

// Returns null for future dates (no data yet), else {level 0-4, count, minutes, topics[]}
function activityFor(dateObj){
  if(dateObj > TODAY) return null;
  const iso = fmtISO(dateObj);
  const r = seeded01(iso);
  let level;
  if(r < 0.30) level = 0;
  else if(r < 0.55) level = 1;
  else if(r < 0.76) level = 2;
  else if(r < 0.92) level = 3;
  else level = 4;
  if(level === 0) return { level:0, count:0, minutes:0, topics:[] };
  const count = level + Math.floor(seeded01(iso+'c') * level);
  const minutes = 12 + level * 14 + Math.floor(seeded01(iso+'m') * 20);
  const topicCount = level >= 3 ? 2 : 1;
  const topics = [];
  for(let i=0;i<topicCount;i++){
    const idx = Math.floor(seeded01(iso+'t'+i) * TOPICS.length);
    if(!topics.includes(TOPICS[idx])) topics.push(TOPICS[idx]);
  }
  return { level, count, minutes, topics };
}

function levelColor(level){
  const map = ["rgba(255,255,255,0.05)", "rgba(55,226,160,0.22)", "rgba(55,226,160,0.42)", "rgba(55,226,160,0.68)", "rgba(55,226,160,0.95)"];
  return map[level];
}

function buildMonthGrid(year, month){
  const firstDay = new Date(year, month, 1);
  const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const cells = [];
  for(let i=0;i<startWeekday;i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(new Date(year, month, d));
  return cells;
}

function monthStats(year, month){
  const daysInMonth = new Date(year, month+1, 0).getDate();
  let active = 0, problems = 0, minutes = 0, streak = 0, curStreak = 0;
  for(let d=1; d<=daysInMonth; d++){
    const date = new Date(year, month, d);
    const a = activityFor(date);
    if(a && a.level > 0){ active++; problems += a.count; minutes += a.minutes; curStreak++; streak = Math.max(streak, curStreak); }
    else curStreak = 0;
  }
  return { active, problems, minutes, streak };
}

function formatDateLong(dateObj){
  return `${MONTH_NAMES[dateObj.getMonth()]} ${dateObj.getDate()}, ${dateObj.getFullYear()}`;
}

/* =========================================================
   MASTERY CONSTELLATION (signature element)
========================================================= */
// low/high anchor colors used to encode actual mastery strength (amber = needs work, emerald = strong)
const MC_LOW = [242,201,76];   // amber — needs improvement
const MC_HIGH = [55,226,160];  // emerald — strong

function mcColor(val, alpha){
  const t = Math.max(0, Math.min(1, val/100));
  const r = Math.round(MC_LOW[0] + (MC_HIGH[0]-MC_LOW[0])*t);
  const g = Math.round(MC_LOW[1] + (MC_HIGH[1]-MC_LOW[1])*t);
  const b = Math.round(MC_LOW[2] + (MC_HIGH[2]-MC_LOW[2])*t);
  return `rgba(${r},${g},${b},${alpha})`;
}

function masteryConstellationSVG(masteryObj, size, opts){
  opts = opts || {};
  const labels = !!opts.labels;
  const entries = Object.entries(masteryObj).sort((a,b)=>b[1]-a[1]);
  const n = entries.length;
  const cx = size/2, cy = size/2, R = size*0.32;
  const nodes = entries.map(([topic, val], i)=>{
    const angle = (i / n) * Math.PI * 2 - Math.PI/2;
    const x = cx + R * Math.cos(angle);
    const y = cy + R * Math.sin(angle);
    return { topic, val, x, y, angle };
  });
  // connective lines: strength of the line reflects how mutually strong the two linked topics are
  let lines = '';
  for(let i=0;i<n;i++){
    for(let j=i+1;j<n;j++){
      const a = nodes[i], b = nodes[j];
      const strength = (a.val + b.val)/200;
      if(strength > 0.55){
        const midVal = (a.val+b.val)/2;
        lines += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${mcColor(midVal, (strength-0.4).toFixed(2))}" stroke-width="1"/>`;
      }
    }
  }
  let dots = '';
  nodes.forEach((node, i)=>{
    const r = 4 + (node.val/100)*(labels ? 9 : 7);
    dots += `
      <circle cx="${node.x}" cy="${node.y}" r="${r+9}" fill="${mcColor(node.val, (node.val/100*0.14).toFixed(2))}"/>
      <circle cx="${node.x}" cy="${node.y}" r="${r}" fill="${mcColor(node.val, (0.4+node.val/100*0.5).toFixed(2))}" stroke="${mcColor(node.val, 0.85)}" stroke-width="1.2">
        <animate attributeName="opacity" values="0.78;1;0.78" dur="${(3+i*0.4).toFixed(1)}s" repeatCount="indefinite"/>
      </circle>`;
    if(labels){
      const lx = cx + (R+34) * Math.cos(node.angle);
      const ly = cy + (R+34) * Math.sin(node.angle);
      const anchor = Math.cos(node.angle) > 0.15 ? 'start' : Math.cos(node.angle) < -0.15 ? 'end' : 'middle';
      dots += `
        <text x="${lx}" y="${ly-3}" text-anchor="${anchor}" font-family="Inter, sans-serif" font-size="${Math.max(10, size*0.032)}" font-weight="600" fill="#f3f3f6">${node.topic}</text>
        <text x="${lx}" y="${ly+12}" text-anchor="${anchor}" font-family="'JetBrains Mono', monospace" font-size="${Math.max(9, size*0.026)}" fill="${mcColor(node.val,0.95)}">${node.val}%</text>`;
    }
  });
  return `<svg viewBox="0 0 ${size} ${size}" width="100%" height="100%" overflow="visible">
    <circle cx="${cx}" cy="${cy}" r="${R+18}" fill="none" stroke="rgba(255,255,255,0.05)" stroke-dasharray="2 6"/>
    ${lines}${dots}
  </svg>`;
}

function attachShellHandlers(){
  document.querySelectorAll('[data-tab]').forEach(el=>{
    el.onclick = ()=>{
      const tab = el.getAttribute('data-tab');
      if(tab === 'institutes'){
        state.section = 'institutes';
      } else {
        state.section = 'workspace';
        state.studentTab = tab;
        state.arenaProblem = null;
      }
      render();
    };
  });
  const lo = document.getElementById('logoutBtn');
  if(lo) lo.onclick = ()=>{ state.role=null; state.user=null; state.section='workspace'; render(); };

  document.querySelectorAll('.queue-row[data-open]').forEach(el=>{
    el.onclick = ()=>{ state.arenaProblem = parseInt(el.getAttribute('data-open')); state.studentTab='practice'; render(); };
  });

  const back = document.getElementById('arenaBack');
  if(back) back.onclick = ()=>{ state.arenaProblem = null; render(); };

  document.querySelectorAll('[data-difficulty]').forEach(el=>{
    el.onclick = ()=>{ state.difficultyFilter = el.getAttribute('data-difficulty'); render(); };
  });

  document.querySelectorAll('[data-cal-day]').forEach(el=>{
    el.onclick = ()=>{ state.selectedDate = el.getAttribute('data-cal-day'); render(); };
  });
  document.querySelectorAll('[data-cal-nav]').forEach(el=>{
    el.onclick = ()=>{
      const dir = el.getAttribute('data-cal-nav');
      if(dir === 'today'){ state.calendarYear = TODAY.getFullYear(); state.calendarMonth = TODAY.getMonth(); }
      else if(dir === 'prev'){ state.calendarMonth--; if(state.calendarMonth < 0){ state.calendarMonth = 11; state.calendarYear--; } }
      else if(dir === 'next'){ state.calendarMonth++; if(state.calendarMonth > 11){ state.calendarMonth = 0; state.calendarYear++; } }
      render();
    };
  });

  // institute directory: tap-to-pin preview (desktop still gets hover via CSS)
  document.querySelectorAll('.inst-card.other').forEach(card=>{
    card.addEventListener('click', (e)=>{
      if(e.target.closest('.admit-btn')) return;
      card.classList.toggle('pinned');
    });
  });
  document.querySelectorAll('.admit-btn[data-admit="open"]').forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      btn.textContent = 'Application started ✓';
      btn.classList.remove('btn-primary');
      btn.classList.add('btn-emerald');
      btn.disabled = true;
    };
  });
  document.querySelectorAll('[data-open-dashboard]').forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      state.section = 'workspace';
      if(state.role === 'student') state.studentTab = 'dashboard';
      render();
    };
  });

  const unlockBtn = document.getElementById('unlockSolutionBtn');
  if(unlockBtn) unlockBtn.onclick = ()=>{ state.premiumModal = true; render(); };
  const closeModal = document.getElementById('closeModal');
  if(closeModal) closeModal.onclick = ()=>{ state.premiumModal = false; render(); };
  const overlay = document.getElementById('modalOverlay');
  if(overlay) overlay.onclick = (e)=>{ if(e.target === overlay){ state.premiumModal = false; render(); } };
}

function renderContributionCalendar(){
  const y = state.calendarYear, m = state.calendarMonth;
  const stats = monthStats(y, m);
  const cells = buildMonthGrid(y, m);
  const isCurrentMonth = (y === TODAY.getFullYear() && m === TODAY.getMonth());

  const dayCells = cells.map(dateObj=>{
    if(!dateObj) return `<div class="cal-cell empty"></div>`;
    const iso = fmtISO(dateObj);
    const isFuture = dateObj > TODAY;
    const a = activityFor(dateObj);
    const isToday = iso === fmtISO(TODAY);
    const isSelected = iso === state.selectedDate;
    const classes = ["cal-cell"];
    if(!isFuture) classes.push("has-data");
    if(isFuture) classes.push("future");
    if(isToday) classes.push("today");
    if(isSelected) classes.push("selected");
    const dotStyle = !isFuture ? `background:${levelColor(a.level)}` : `background:transparent`;
    return `<div class="${classes.join(' ')}" ${!isFuture ? `data-cal-day="${iso}"` : ''} title="${!isFuture ? formatDateLong(dateObj) + (a.level ? ` — ${a.count} problem${a.count===1?'':'s'} solved` : ' — no activity') : 'Upcoming'}">
      <span class="dnum">${dateObj.getDate()}</span>
      <span class="dot" style="${dotStyle}"></span>
    </div>`;
  }).join('');

  const selDate = new Date(state.selectedDate + 'T00:00:00');
  const selActivity = activityFor(selDate);
  const detailHTML = selActivity ? `
    <div class="cal-detail">
      <div class="dd-date">${formatDateLong(selDate)}</div>
      <div class="dd-meta">${selActivity.level > 0
        ? `${selActivity.count} problem${selActivity.count===1?'':'s'} solved · ${selActivity.minutes} min practiced`
        : `No practice logged this day.`}</div>
      ${selActivity.topics.length ? `<div class="dd-topics">${selActivity.topics.map(t=>`<span class="tag tag-easy">${t}</span>`).join('')}</div>` : ''}
    </div>` : '';

  return `
    <div class="card-head"><div><h3>Contribution calendar</h3><div class="cap">Practice activity, day by day — click any date for detail</div></div></div>
    <div class="cal-summary">
      <div class="kpi"><div class="k-val">${stats.active}</div><div class="k-lab">Active days this month</div></div>
      <div class="kpi-div"></div>
      <div class="kpi"><div class="k-val">${stats.problems}</div><div class="k-lab">Problems solved</div></div>
      <div class="kpi-div"></div>
      <div class="kpi"><div class="k-val">${stats.streak}d</div><div class="k-lab">Longest streak</div></div>
    </div>

    <div class="cal-head">
      <div class="cal-title">${MONTH_NAMES[m]} ${y}</div>
      <div class="cal-nav">
        ${!isCurrentMonth ? `<button class="cal-nav-btn today-btn" data-cal-nav="today">Today</button>` : ''}
        <button class="cal-nav-btn" data-cal-nav="prev">${ICONS.arrowLeft}</button>
        <button class="cal-nav-btn" data-cal-nav="next" style="transform:scaleX(-1); ${isCurrentMonth ? 'opacity:.35; pointer-events:none;' : ''}">${ICONS.arrowLeft}</button>
      </div>
    </div>
    <div class="cal-weekdays">${WEEKDAY_LABELS.map(w=>`<span>${w}</span>`).join('')}</div>
    <div class="cal-grid">${dayCells}</div>
    <div class="cal-legend">
      <span>Less</span>
      ${[0,1,2,3,4].map(l=>`<span class="lg-cell" style="background:${levelColor(l)}"></span>`).join('')}
      <span>More</span>
    </div>
    ${detailHTML}
  `;
}

  <div class="fade-in">
    <div class="toolbar">
      ${['All','Easy','Medium','Hard'].map(d=>`<div class="chip ${filter===d?'active':''}" data-difficulty="${d}">${d}</div>`).join('')}
    </div>
    <div class="card glass" style="padding:8px 8px;">
      <table>
        <thead><tr><th>Problem</th><th>Topic</th><th>Toughness</th><th>Difficulty</th><th></th></tr></thead>
        <tbody>
          ${list.map(p=>`
            <tr style="cursor:pointer" data-open="${p.id}">
              <td class="cell-strong">${p.title} ${p.premium ? `<span class="lock-badge" style="margin-left:6px;">${ICONS.lock} premium</span>` : ''}</td>
              <td>${p.topic}</td>
              <td style="font-family:var(--font-mono)">${p.toughness}</td>
              <td><span class="tag ${difficultyTagClass(p.toughness)}">${difficultyOf(p.toughness)}</span></td>
              <td style="text-align:right; color:var(--text-faint)">Open →</td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>
  </div>`;
}

function renderArenaDetail(){
  const p = DB.problems.find(x=>x.id === state.arenaProblem);
  const canSeeSolution = !p.premium || state.user.premium;
  return `
  <div class="fade-in">
    <div class="back-link" id="arenaBack">${ICONS.arrowLeft} Back to problem list</div>
    <div class="arena-split">
      <div class="arena-panel glass">
        <div style="display:flex; align-items:center; gap:10px; margin-bottom:6px;">
          <span class="tag ${difficultyTagClass(p.toughness)}">${difficultyOf(p.toughness)}</span>
          <span class="tag">${p.topic}</span>
          ${p.premium ? `<span class="lock-badge">${ICONS.lock} premium</span>` : ''}
        </div>
        <div class="arena-title">${p.title}</div>
        <div class="arena-desc">
          Given the constraints of this ${p.topic.toLowerCase()} problem, design an approach that stays within
          O(n log n) time. Your solution will be scored against the live toughness benchmark
          (currently rated ${p.toughness}/100), which adjusts as more students submit.
          <br/><br/>
          Think in terms of the invariant you can maintain as you scan the input — that's usually the
          fastest way into problems in this family.
        </div>
        <div style="margin-top:20px; display:flex; gap:10px;">
          <button class="btn btn-primary">Start attempt</button>
          <button class="btn btn-ghost">Ask a mentor</button>
        </div>
      </div>

      <div class="arena-panel glass">
        <div class="card-head"><div><h3>Reference approach</h3><div class="cap">${canSeeSolution ? 'Unlocked for your account' : 'Premium unlock required'}</div></div></div>
        ${canSeeSolution ? `
        <div class="code-block"><span class="cm">// outline only — fill in the transition</span>
<span class="kw">function</span> <span class="fn">solve</span>(input) {
  <span class="kw">let</span> best = <span class="kw">new</span> Map();
  <span class="kw">for</span> (<span class="kw">const</span> x <span class="kw">of</span> input) {
    <span class="cm">// maintain the running invariant here</span>
  }
  <span class="kw">return</span> best;
}</div>` : `
        <div class="solution-lock">
          ${ICONS.lock}
          <div style="color:#fff; font-weight:600; font-size:14px; margin-bottom:6px;">Solution locked</div>
          <div style="color:var(--text-faint); font-size:12.5px; margin-bottom:16px;">This problem's reference approach and mentor chat are part of SmartEd Premium.</div>
          <button class="btn btn-emerald btn-sm" id="unlockSolutionBtn">${ICONS.bolt} Unlock with Premium</button>
        </div>`}
      </div>
    </div>
  </div>`;
}

function premiumModalHTML(){
  return `
  <div class="overlay ${state.premiumModal ? 'show':''}" id="modalOverlay">
    <div class="modal glass">
      <div class="close-x" id="closeModal">${ICONS.x}</div>
      <div class="modal-icon">${ICONS.bolt}</div>
      <h3>Unlock SmartEd Premium</h3>
      <p>Get reference solutions, mentor chat, and priority contest seeding on every problem.</p>
      <div class="modal-feat">
        <div class="row">${ICONS.check} Full reference solutions, not just hints</div>
        <div class="row">${ICONS.check} 1:1 mentor chat on any problem</div>
        <div class="row">${ICONS.check} Early access to weekly contests</div>
      </div>
      <button class="btn btn-primary btn-block">Upgrade — demo only</button>
    </div>
  </div>`;
}

function renderHomework(){
  return `<div class="fade-in card glass" style="padding:8px;">
    <table>
      <thead><tr><th>Assignment</th><th>Due</th><th>Progress</th><th></th></tr></thead>
      <tbody>
        ${DB.homework.map(h=>`
          <tr><td class="cell-strong">${h.title}</td><td>${h.due}</td>
          <td style="width:220px;"><div class="topic-bar-track"><div class="topic-bar-fill" style="width:${h.progress}%"></div></div></td>
          <td style="text-align:right;"><button class="btn btn-ghost btn-sm">${h.progress===0?'Start':'Continue'}</button></td></tr>`).join('')}
      </tbody>
    </table>
  </div>`;
}

function renderProjects(){
  return `<div class="fade-in grid g-2">
    ${DB.projects.map(p=>`
      <div class="card glass">
        <div class="card-head"><div><h3>${p.title}</h3><div class="cap">with ${p.partner}</div></div><span class="tag tag-easy">${p.status}</span></div>
        <div style="font-size:12.5px; color:var(--text-dim);">${p.stage}</div>
      </div>`).join('')}
  </div>`;
}

function renderDiscuss(){
  return `<div class="fade-in card glass" style="padding:6px;">
    ${DB.discussions.map(d=>`
      <div class="queue-row">
        <div class="qi">${d.user.split(' ').map(x=>x[0]).join('')}</div>

          <div class="qmeta">${d.user} · ${d.topic} · ${d.time}</div>

        <div class="qright"><span class="tag">${d.replies} replies</span></div>
      </div>`).join('')}

}

function renderContest(){
  return `<div class="fade-in grid g-2">
    ${DB.contests.map(c=>`
      <div class="card glass">
        <div class="card-head"><div><h3>${c.name}</h3><div class="cap">${c.start} · ${c.problems} problems</div></div><span class="tag ${c.status==='Registered'?'tag-easy':''}">${c.status}</span></div>
        <button class="btn btn-ghost btn-sm">${c.status==='Registered' ? 'View details' : 'Register'}</button>
      </div>`).join('')}
  </div>`;
}

/* =========================================================
   FACULTY SHELL
========================================================= */
const FACULTY_NAV = [ { key:'dashboard', label:'Class Overview', icon:'grid' } ];

function renderFacultyShell(){
  const c = DB.facultyClass;
  const showDirectory = state.section === 'institutes';
  return `
  <div class="shell">
    ${sidebarHTML(FACULTY_NAV, 'dashboard')}
    <div class="main">
      ${mobileTopnav(FACULTY_NAV, 'dashboard')}
      <div class="topbar">
        <div>
          <div class="topbar-title">${showDirectory ? 'Institutes' : 'Class Overview'}</div>
          <div class="topbar-sub">${showDirectory ? 'Browse every institute on SmartEd — your own opens fully, others preview on hover' : `${state.user.institute} · ${state.user.classes.join(', ')}`}</div>
        </div>
        <div class="topbar-right"><div class="search-box">${ICONS.search}<input placeholder="Search students…"/></div></div>
      </div>
      <div class="content fade-in">
      ${showDirectory ? renderInstituteDirectory() : `
        <div class="grid g-4" style="margin-bottom:16px;">
          <div class="card glass stat-card"><div class="label">Students</div><div class="value">${c.studentCount}</div></div>
          <div class="card glass stat-card"><div class="label">Avg mastery</div><div class="value">${c.avgMastery}%</div><div class="delta delta-up">+2% vs last week</div></div>
          <div class="card glass stat-card"><div class="label">At risk</div><div class="value">${c.risk.length}</div><div class="delta delta-down">needs attention</div></div>
          <div class="card glass stat-card"><div class="label">Advanced</div><div class="value">${c.advanced.length}</div><div class="delta delta-up">ahead of pace</div></div>
        </div>

        <div class="grid g-2">
          <div class="card glass">
            <div class="card-head"><div><h3>Students at risk</h3><div class="cap">Falling mastery or missed streaks</div></div><span class="risk-pill risk-high">attention</span></div>
            <table>
              <thead><tr><th>Student</th><th>Mastery</th><th>Weak topic</th></tr></thead>
              <tbody>
                ${c.risk.map(r=>`<tr><td class="cell-strong">${r.name}</td><td>${r.mastery}%</td><td>${r.topic}</td></tr>`).join('')}
              </tbody>
            </table>
          </div>
          <div class="card glass">
            <div class="card-head"><div><h3>Advanced students</h3><div class="cap">Ready for stretch problems</div></div><span class="risk-pill risk-strong">strong</span></div>
            <table>
              <thead><tr><th>Student</th><th>Mastery</th><th>Streak</th></tr></thead>
              <tbody>
                ${c.advanced.map(r=>`<tr><td class="cell-strong">${r.name}</td><td>${r.mastery}%</td><td>${r.streak}d</td></tr>`).join('')}
              </tbody>
            </table>
          </div>
        </div>

        <div class="card glass" style="margin-top:16px;">
          <div class="card-head"><div><h3>Topic mastery across class</h3></div></div>
          <div class="grid g-4">
            ${Object.entries(DB.mastery).map(([topic,val])=>`
              <div class="topic-card glass glass-tight">
                <div class="tname">${topic}</div>
                <div class="topic-bar-track"><div class="topic-bar-fill" style="width:${val}%"></div></div>
                <div class="pct">${val}% class avg</div>
              </div>`).join('')}
          </div>
        </div>`}
      </div>
    </div>
  </div>`;
}

/* =========================================================
   INSTITUTE SHELL
========================================================= */

        </div>
        <div class="topbar-right"><div class="search-box">${ICONS.search}<input placeholder="Search faculty…"/></div></div>
      </div>
      <div class="content fade-in">
      ${showDirectory ? renderInstituteDirectory() : `
        <div class="grid g-4" style="margin-bottom:16px;">
          <div class="card glass stat-card"><div class="label">Faculty</div><div class="value">${r.facultyCount}</div></div>
          <div class="card glass stat-card"><div class="label">Students</div><div class="value">${r.studentCount.toLocaleString()}</div></div>
          <div class="card glass stat-card"><div class="label">Adoption</div><div class="value">${r.adoption}%</div><div class="delta delta-up">+5% this term</div></div>
          <div class="card glass stat-card"><div class="label">Engagement</div><div class="value">${r.engagement}%</div><div class="delta" style="color:var(--text-faint)">weekly active</div></div>
        </div>

        <div class="grid g-12-8">
          <div class="card glass">
            <div class="card-head"><div><h3>Faculty roster</h3><div class="cap">Classes, students, and class-average mastery</div></div></div>
            <table>
              <thead><tr><th>Faculty</th><th>Classes</th><th>Students</th><th>Avg mastery</th></tr></thead>
              <tbody>
                ${r.faculty.map(f=>`<tr><td class="cell-strong">${f.name}</td><td>${f.classes}</td><td>${f.students}</td><td>${f.avgMastery}%</td></tr>`).join('')}
              </tbody>
            </table>
          </div>
          <div class="card glass">
            <div class="card-head"><div><h3>Institute mastery map</h3></div></div>
            <div style="width:100%; aspect-ratio:1;">${masteryConstellationSVG(DB.mastery, 300)}</div>
          </div>
        </div>

        <div class="card glass" style="margin-top:16px;">
          <div class="card-head"><div><h3>Engagement by topic</h3><div class="cap">Share of active students practicing each domain this week</div></div></div>

                <div class="pct">${Math.min(100, val+10)}% engaged</div>
              </div>`).join('')}
          </div>
        </div>`}
      </div>
    </div>
  </div>`;
}

render();
</script>
</body>
</html>
